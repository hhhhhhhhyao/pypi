name: build (tokenizers)
on:
  workflow_dispatch:
    inputs:
      version:
        default: '0.15.2'
        description: 'Package version'
        type: string
        required: true

jobs:
  build_wheels:
    runs-on: ubuntu-latest
    steps:
      - name: Get Source Code
        run: |
          package=tokenizers
          version=${{ github.event.inputs.version }}
          echo "Building package: ${package} version: ${version}"
          echo "VERSION=v${version}" >> $GITHUB_ENV

      - name: Checkout tokenizers source
        uses: actions/checkout@v6
        with:
          repository: huggingface/tokenizers
          ref: ${{ env.VERSION }}

      - name: Setup QEMU for loong64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: loong64

     name: Build tokenizers wheel for loongarch64 py38

on:
  workflow_dispatch:

jobs:
  build_wheels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build wheel in ghcr.io/loong64/debian:trixie-slim
        run: |
          docker run --rm --platform linux/loong64 \
            -v ${{ github.workspace }}:/work \
            -w /work \
            ghcr.io/loong64/debian:trixie-slim \
            bash -c '
              set -e
              apt-get update
              apt-get install -y wget build-essential libssl-dev zlib1g-dev \
                libncurses5-dev libffi-dev libsqlite3-dev \
                libreadline-dev libgdbm-dev libbz2-dev \
                liblzma-dev uuid-dev curl git
              # Clone tokenizers source at v0.15.2
              git clone --depth 1 --branch v0.15.2 https://github.com/huggingface/tokenizers.git /tmp/tok
              # Compile Python 3.8 from source
              wget -q https://www.python.org/ftp/python/3.8.18/Python-3.8.18.tgz
              tar xzf Python-3.8.18.tgz -C /tmp/tok/bindings/python/
              cd /tmp/tok/bindings/python/Python-3.8.18
              curl -sSL -o config.guess "https://git.savannah.gnu.org/gitweb/?p=config.git;a=blob_plain;f=config.guess"
              curl -sSL -o config.sub "https://git.savannah.gnu.org/gitweb/?p=config.git;a=blob_plain;f=config.sub"
              chmod +x config.guess config.sub
              ./configure --build=loongarch64-unknown-linux-gnu --host=loongarch64-unknown-linux-gnu \
                --prefix=/usr/local/python38 --enable-optimizations=no --with-ensurepip=install
              make -j4 && make install
              # Install Rust and maturin
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              source ~/.cargo/env
              rustup target add loongarch64-unknown-linux-gnu
              /usr/local/python38/bin/python3.8 -m pip install --upgrade pip
              /usr/local/python38/bin/python3.8 -m pip install maturin
              # Build tokenizers wheel
              cd /tmp/tok/bindings/python
              /usr/local/python38/bin/python3.8 -m maturin build --release --out /work/dist -i /usr/local/python38/bin/python3.8
              echo "=== dist contents ==="
              ls -la /work/dist/
            '

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenizers-wheel
          path: dist/*.whl
          if-no-files-found: error
