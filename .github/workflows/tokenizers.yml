name: build (tokenizers)
on:
  workflow_dispatch:
    inputs:
      version:
        default: '0.15.2'
        description: 'Package version'
        type: string
        required: true

jobs:
  build_wheels:
    runs-on: ubuntu-latest
    steps:
      - name: Get Source Code
        run: |
          package=tokenizers
          version=${{ github.event.inputs.version }}
          echo "Building package: ${package} version: ${version}"
          echo "VERSION=v${version}" >> $GITHUB_ENV

      - name: Checkout tokenizers source
        uses: actions/checkout@v6
        with:
          repository: huggingface/tokenizers
          ref: ${{ env.VERSION }}

      - name: Setup QEMU for loongarch64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: loongarch64

      - name: List pythons in loong64 image
        run: |
          docker run --rm --platform linux/loongarch64 \
            ghcr.io/loong64/manylinux_2_28_loongarch64:latest \
            bash -c "ls /opt/python/ 2>/dev/null; echo '---'; which python3.8; which python3.9; which python3.10"

      - name: Build wheel in loong64 manylinux container
        run: |
          docker run --rm --platform linux/loongarch64 \
            -v ${{ github.workspace }}:/work \
            -w /work/bindings/python \
            ghcr.io/loong64/manylinux_2_28_loongarch64:latest \
            bash -c '
              set -e
              echo "=== Available Pythons ==="
              ls /opt/python/ 2>/dev/null || echo "no /opt/python"

              # Find python3.8
              PYTHON_BIN=""
              for path in /opt/python/cp38-cp38/bin/python3.8 /usr/bin/python3.8 /usr/local/bin/python3.8; do
                if [ -x "$path" ]; then
                  PYTHON_BIN="$path"
                  break
                fi
              done
              if [ -z "$PYTHON_BIN" ]; then
                echo "ERROR: python3.8 not found"
                ls /opt/python/ 2>/dev/null
                exit 1
              fi
              echo "=== Using python: $PYTHON_BIN ==="
              $PYTHON_BIN --version

              # Install Rust
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              source ~/.cargo/env
              rustup target add loongarch64-unknown-linux-gnu
              echo "Rust installed: $(rustc --version)"

              # Install maturin
              $PYTHON_BIN -m pip install --upgrade pip
              $PYTHON_BIN -m pip install maturin
              echo "maturin installed: $(maturin --version)"

              # Build wheel
              maturin build --release --out dist -i $PYTHON_BIN
              echo "=== Built wheels ==="
              ls -la dist/
            '

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenizers-wheel
          path: bindings/python/dist/*.whl
