name: build (tokenizers)
on:
  workflow_dispatch:
    inputs:
      version:
        default: '0.15.2'
        description: 'Package version'
        type: string
        required: true

jobs:
  build_wheels:
    runs-on: ubuntu-latest
    steps:
      - name: Get Source Code
        run: |
          package=tokenizers
          version=${{ github.event.inputs.version }}
          echo "Building package: ${package} version: ${version}"
          echo "VERSION=v${version}" >> $GITHUB_ENV

      - name: Checkout tokenizers source
        uses: actions/checkout@v6
        with:
          repository: huggingface/tokenizers
          ref: ${{ env.VERSION }}

      - name: Setup QEMU for loongarch64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: loongarch64

      - name: Test alpine availability
        run: |
          docker pull --platform linux/loongarch64 alpine:latest && echo "alpine OK" || echo "alpine FAIL"

      - name: Build wheel in alpine (with self-compiled python3.8)
        run: |
          docker run --rm --platform linux/loongarch64 \
            -v ${{ github.workspace }}:/work \
            -w /work/bindings/python \
            alpine:latest \
            sh -c '
              set -e
              echo "=== Step 1: Install build deps ==="
              apk add --no-cache build-base wget openssl-dev zlib-dev bzip2-dev \
                readline-dev sqlite-dev gdbm-dev ncurses-dev xz-dev tk-dev \
                libffi-dev linux-headers curl

              echo "=== Step 2: Compile Python 3.8 from source ==="
              cd /tmp
              wget https://www.python.org/ftp/python/3.8.18/Python-3.8.18.tgz
              tar xzf Python-3.8.18.tgz
              cd Python-3.8.18
              ./configure --prefix=/usr/local/python38 --enable-optimizations=no --with-ensurepip=install
              make -j4
              make install
              /usr/local/python38/bin/python3.8 --version
              /usr/local/python38/bin/python3.8 -m pip install --upgrade pip

              echo "=== Step 3: Install Rust ==="
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              source ~/.cargo/env
              rustup target add loongarch64-unknown-linux-gnu
              echo "Rust: $(rustc --version)"

              echo "=== Step 4: Install maturin ==="
              /usr/local/python38/bin/python3.8 -m pip install maturin
              echo "maturin: $(maturin --version)"

              echo "=== Step 5: Build tokenizers wheel ==="
              cd /work/bindings/python
              maturin build --release --out dist -i /usr/local/python38/bin/python3.8 --manylinux 2_28
              echo "=== Built wheels ==="
              ls -la dist/
            '

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenizers-wheel
          path: bindings/python/dist/*.whl
